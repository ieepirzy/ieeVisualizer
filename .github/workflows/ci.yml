name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    env:
      MPLBACKEND: Agg
      # tests/view/test_email_browser.py lays the email HTML out in headless
      # Chromium; here it must run, so a missing browser fails instead of skipping.
      IEEV_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install Chromium for the email layout tests
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: python -m pytest
      # Check the built wheel, not the source tree: install it into a fresh venv
      # and import every package found in the source from outside the checkout,
      # so a subpackage missing from the wheel fails here. One matrix entry only.
      - name: Wheel install smoke test
        if: matrix.python-version == '3.12'
        run: |
          python -m pip wheel . --no-deps -w "$RUNNER_TEMP/dist"
          python -m venv "$RUNNER_TEMP/wheelenv"
          "$RUNNER_TEMP/wheelenv/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl
          pkgs=$(find ieeVisualizer -name __init__.py -exec dirname {} \; | tr / . | sort)
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheelenv/bin/python" - $pkgs <<'PY'
          import importlib, os, sys
          for name in sys.argv[1:]:
              mod = importlib.import_module(name)
              assert os.environ["GITHUB_WORKSPACE"] not in mod.__file__, mod.__file__
              print("ok", name, mod.__file__)
          PY
