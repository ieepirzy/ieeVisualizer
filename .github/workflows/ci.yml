name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
        matplotlib: [""]
        include:
          # the declared floor (pyproject: matplotlib>=3.6)
          - python-version: "3.10"
            matplotlib: "3.6.3"
    env:
      MPLBACKEND: Agg
      # tests/view/test_email_browser.py lays the email HTML out in headless
      # Chromium; here it must run, so a missing browser fails instead of skipping.
      IEEV_REQUIRE_BROWSER: "1"
      # tests/render/test_mobile_profiles.py compares renders without a profile
      # with hashes recorded from main per matplotlib version; fail, not skip,
      # when this matplotlib has none (re-record: tests/render/data/record_main_hashes.py).
      # (not at the floor: main's bytes were recorded for the default versions)
      IEEV_REQUIRE_MAIN_HASHES: ${{ matrix.matplotlib == '' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          if [ -n "${{ matrix.matplotlib }}" ]; then
            python -m pip install "matplotlib==${{ matrix.matplotlib }}" "numpy<2"
          fi
      - name: Install Chromium for the email layout tests
        run: |
          # playwright 1.61+ needs Python >= 3.10; 1.60.0 is the last for 3.9
          python -m pip install "playwright==1.60.0; python_version < '3.10'" \
                                "playwright==1.64.0; python_version >= '3.10'"
          python -m playwright install --with-deps chromium
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: python -m pytest
      # Check the built wheel, not the source tree: install it into a fresh venv
      # and import every package found in the source from outside the checkout,
      # so a subpackage missing from the wheel fails here. One matrix entry only.
      - name: Wheel install smoke test
        if: matrix.python-version == '3.12'
        run: |
          python -m pip wheel . --no-deps -w "$RUNNER_TEMP/dist"
          python -m venv "$RUNNER_TEMP/wheelenv"
          "$RUNNER_TEMP/wheelenv/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl
          pkgs=$(find ieeVisualizer -name __init__.py -exec dirname {} \; | tr / . | sort)
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheelenv/bin/python" - $pkgs <<'PY'
          import importlib, os, sys
          for name in sys.argv[1:]:
              mod = importlib.import_module(name)
              assert os.environ["GITHUB_WORKSPACE"] not in mod.__file__, mod.__file__
              print("ok", name, mod.__file__)
          PY
