[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ieeVisualizer"
version = "0.1.0"
description = "Plot functions, surfaces and vector fields from Python callables or SymPy expressions with Matplotlib; groundwork for a declarative, agent-accessible visualization layer"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "matplotlib",
    "numpy",
    "sympy",
]

[project.optional-dependencies]
dev = [
    "jsonschema",
    "pytest",
    "ruff",
]
# Optional Manim animation adapter (ieeVisualizer.animation.manim_adapter).
# Needs system Cairo and Pango development files to build manimpango/pycairo
# (Debian/Ubuntu: libcairo2-dev libpango1.0-dev pkg-config); no LaTeX needed.
# Tested with manim 0.22.0. CI does not install it.
manim = [
    "manim>=0.22",
]

# Discover subpackages too; a bare ``packages = ["ieeVisualizer"]`` ships only
# the top-level package and silently drops e.g. ``ieeVisualizer.spec``.
[tool.setuptools.packages.find]
include = ["ieeVisualizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
